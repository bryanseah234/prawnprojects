name: Public catalog checks
on:
  push:
    branches: [main, master]
    paths:
      - '**.ts'
      - '**.tsx'
      - '**.js'
      - '**.mjs'
      - '**.css'
      - 'data/**'
      - 'index.html'
      - 'package*.json'
      - 'tsconfig.json'
      - '.github/workflows/catalog-checks.yml'
  pull_request:
    branches: [main, master]
    paths:
      - '**.ts'
      - '**.tsx'
      - '**.js'
      - '**.mjs'
      - '**.css'
      - 'data/**'
      - 'index.html'
      - 'package*.json'
      - 'tsconfig.json'
      - '.github/workflows/catalog-checks.yml'
permissions:
  contents: read
concurrency:
  group: public-catalog-${{ github.ref }}
  cancel-in-progress: true
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_VERCEL_API_TOKEN: synthetic-catalog-credential-vite
          GEMINI_API_KEY: synthetic-catalog-credential-gemini
